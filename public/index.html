<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KineticLab 3D — APK Download</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d131a;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #141c26;
      border: 1px solid #263241;
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #f0f6fc;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #8b949e;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #2f81f7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 8px;
    }
    .btn:hover {
      background: #1f6feb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>KineticLab 3D</h1>
    <p>Debug Android APK build is ready. Your download should start automatically.</p>
    <a class="btn" href="/app-debug.apk" download="app-debug.apk">Download APK (app-debug.apk)</a>
  </div>
  <script>
    window.addEventListener("load", function () {
      const a = document.createElement("a");
      a.href = "/app-debug.apk";
      a.download = "app-debug.apk";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
